<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TBH Analizer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="brand">TBH Analizer <span class="mode" id="mode">connecting…</span></div>
    <label>Theme <select id="theme"><option value="auto">System</option><option value="light">Light</option><option value="dark">Dark</option></select></label>
    <nav id="tabs" aria-label="Sections"></nav>
    <div class="health" id="health" title="Collector status"></div>
  </header>
  <div id="notice" role="status" hidden></div>
  <main id="view" aria-live="polite"></main>
  <footer class="foot" id="foot"></footer>
  <script src="app.js"></script>
</body>
</html>
